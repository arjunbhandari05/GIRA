services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - ollama

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    command: node agent/heartbeat.js
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
